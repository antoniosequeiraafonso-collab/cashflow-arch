    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const status = document.getElementById("status");
    const btn = document.getElementById("importBtn");

    async function importData() {
      btn.disabled = true;
      status.textContent = "A autenticar anonimamente...";
      await signInAnonymously(auth);

      status.textContent = "A importar movimentos...";
      const batch = writeBatch(db);
      MOVEMENTS.forEach((movement) => {
        const ref = doc(db, "movements", movement.id);
        const { id, ...payload } = movement;
        batch.set(ref, {
          ...payload,
          importedAt: serverTimestamp()
        }, { merge: true });
      });

      await batch.commit();
      status.innerHTML = `Importação concluída: <strong>${MOVEMENTS.length}</strong> movimentos carregados. Podes voltar à app.`;
      btn.textContent = "Importado";
    }

    btn.addEventListener("click", () => {
      importData().catch((error) => {
        console.error(error);
        status.textContent = "Erro: " + error.message;
        btn.disabled = false;
      });
    });
